<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
</head>
  <body class="full">
    <div id="counts">
      <span class="count-label"><span class="count-icon">📑</span>Total: <span id="total-count">0</span></span>
      <span class="count-label"><span class="count-icon">🔥</span>Active: <span id="active-count">0</span></span>
    </div>
    <div id="menu">
      <button id="btn-all">All</button>
      <button id="btn-recent">Recent</button>
      <button id="btn-dups">Duplicates</button>
      <select id="container-filter">
        <option value="">All Containers</option>
      </select>
    </div>
    <div class="search-wrapper">
      <input type="text" id="search" placeholder="Search tabs" />
      <button id="search-clear" class="clear-btn hidden" type="button">&times;</button>
    </div>
    <div id="error"></div>
    <div id="tabs-wrapper" class="tab-grid-wrapper">
      <div id="tabs" class="tab-grid"></div>
    </div>
    <div id="bulk-actions">
      <select id="container-target"></select>
      <button id="bulk-add-container">Add to Container</button>
      <button id="bulk-remove-container">Remove from Container</button>
      <button id="bulk-close">Close</button>
      <button id="bulk-reload">Reload</button>
      <button id="bulk-discard">Unload</button>
      <button id="bulk-unload-all">Unload All</button>
    </div>
    <div id="easter-egg" class="hidden">
      <div class="egg-content">
        <h2>🎉 Hidden Menu 🎉</h2>
        <p>Surprise! You found it.</p>
      </div>
    </div>
    <div id="context" class="hidden"></div>

    <footer id="version"></footer>

    <script src="theme.js"></script>
    <script src="hyperlist.js"></script>
    <script src="popup.js"></script>
    <script src="fullwin.js"></script>
    <!-- layout handled via CSS grid -->
  </body>
</html>
